name: Warnings Report

# Builds with clang-tidy (checks from .clang-tidy) and with GCC (project warning flags),
# then posts a deduplicated warnings report as a PR comment (updated on each push).
# Warnings do not fail the build.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: [
          { name: "clang-tidy (clang-22)", id: clang-tidy, cc: clang-22, cxx: clang++-22, tidy: clang-tidy-22 },
          { name: "gcc-15 warnings", id: gcc, cc: gcc-15, cxx: g++-15, tidy: "" },
        ]

    steps:
    - uses: actions/checkout@v7

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install libgtkmm-3.0-dev gettext

    # toolchains/linux-dev-with-tidy.cmake hardcodes an unversioned "clang-tidy",
    # so we use linux-dev.cmake and pass the versioned binary.
    - name: Configure CMake
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cxx }}
      run: >
        cmake -B build -S "$GITHUB_WORKSPACE"
        -DCMAKE_BUILD_TYPE=Debug
        -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/toolchains/linux-dev.cmake"
        -DCMAKE_CXX_CLANG_TIDY="${{ matrix.tidy }}"

    - name: Build
      run: |
        set -o pipefail
        cmake --build build --parallel "$(nproc)" 2>&1 | tee build.log

    - name: Upload build log
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: build-log-${{ matrix.id }}
        path: build.log
        if-no-files-found: ignore
        retention-days: 7


  report:
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
    - uses: actions/checkout@v7

    - name: Download build logs
      uses: actions/download-artifact@v8
      with:
        pattern: build-log-*
        path: logs

    - name: Get changed files
      if: ${{ github.event_name == 'pull_request' }}
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: >
        gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" -q '.[].filename'
        > changed-files.txt

    - name: Generate report
      run: |
        changed=()
        if [ -f changed-files.txt ]; then changed=(--changed-files changed-files.txt); fi
        python3 .github/scripts/warnings_report.py \
          --workspace "$GITHUB_WORKSPACE" --build-dir build "${changed[@]}" \
          --log "clang-tidy (clang-22)=logs/build-log-clang-tidy/build.log" \
          --log "GCC 15=logs/build-log-gcc/build.log" \
          > report.md
        cat report.md >> "$GITHUB_STEP_SUMMARY"

    # The token is read-only for PRs from forks, so the report is only in the job summary there.
    - name: Post or update PR comment
      if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        marker='<!-- gsmartcontrol-warnings-report -->'
        comment_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
          -q ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
        if [ -n "$comment_id" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -F body=@report.md > /dev/null
        else
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@report.md > /dev/null
        fi
