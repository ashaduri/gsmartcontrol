name: clang-tidy

# Builds with clang-tidy enabled (using the checks in .clang-tidy).
# clang-tidy warnings do not fail the build; they are included in the warnings report (see ci.yml).
# Called from ci.yml (on push / pull request), or run manually from the Actions tab.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep in sync with the job name below.
  LLVM_VERSION: 22

jobs:

  clang-tidy:
    name: clang-tidy (clang-22)
    runs-on: ubuntu-26.04
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v7

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install libgtkmm-3.0-dev gettext

    # toolchains/linux-dev-with-tidy.cmake hardcodes an unversioned "clang-tidy",
    # so we use linux-dev.cmake and pass the versioned binary.
    - name: Configure CMake
      env:
        CC: clang-${{ env.LLVM_VERSION }}
        CXX: clang++-${{ env.LLVM_VERSION }}
      run: >
        cmake -B build -S "$GITHUB_WORKSPACE"
        -DCMAKE_BUILD_TYPE=Debug
        -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/toolchains/linux-dev.cmake"
        -DCMAKE_CXX_CLANG_TIDY="clang-tidy-${LLVM_VERSION}"

    - name: Build with clang-tidy
      run: |
        set -o pipefail
        cmake --build build --parallel "$(nproc)" 2>&1 | tee build.log

    - name: Save build log
      if: ${{ always() }}
      uses: ./.github/actions/save-build-log
      with:
        id: clang-tidy-${{ env.LLVM_VERSION }}
        title: clang-tidy ${{ env.LLVM_VERSION }}
