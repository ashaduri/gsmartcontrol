name: clang-tidy

# Builds with clang-tidy enabled (using the checks in .clang-tidy).
# clang-tidy warnings are reported in the log and the job summary, but do not fail the build.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in sync with the job name below.
  LLVM_VERSION: 22

jobs:

  clang-tidy:
    name: clang-tidy (clang-22)
    runs-on: ubuntu-26.04
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v7

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install libgtkmm-3.0-dev gettext

    # toolchains/linux-dev-with-tidy.cmake hardcodes an unversioned "clang-tidy",
    # so we use linux-dev.cmake and pass the versioned binary.
    - name: Configure CMake
      env:
        CC: clang-${{ env.LLVM_VERSION }}
        CXX: clang++-${{ env.LLVM_VERSION }}
      run: >
        cmake -B build -S "$GITHUB_WORKSPACE"
        -DCMAKE_BUILD_TYPE=Debug
        -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/toolchains/linux-dev.cmake"
        -DCMAKE_CXX_CLANG_TIDY="clang-tidy-${LLVM_VERSION}"

    - name: Build with clang-tidy
      run: |
        set -o pipefail
        cmake --build build --parallel "$(nproc)" 2>&1 | tee build.log

    - name: Summary
      if: ${{ always() }}
      run: |
        count=$(grep -cE '^[^ ]+:[0-9]+:[0-9]+: warning: .*\[[a-z0-9.,-]+\]$' build.log || true)
        {
          echo "### clang-tidy"
          echo
          echo "Warnings: ${count}"
          echo
          echo "Top checks:"
          echo
          echo '```'
          grep -oE '\[[a-z0-9.-]+(,[a-z0-9.-]+)*\]$' build.log | sort | uniq -c | sort -rn | head -20 || true
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
