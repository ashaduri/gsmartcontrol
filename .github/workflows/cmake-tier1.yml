name: Build (Tier 1 platforms)

on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:


permissions:
  contents: read

# Cancel superseded runs of the same PR (pushes to main always run to completion).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: RelWithDebInfo


jobs:

  linux-ubuntu:
    name: linux-ubuntu-${{ matrix.os }} (gcc-${{ matrix.gcc }})
    runs-on: ubuntu-${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: [
          { os: "22.04", gcc: 11 },
          { os: "24.04", gcc: 14 },
          { os: "26.04", gcc: 15 },
        ]

    steps:
    - uses: actions/checkout@v7

    - name: Update Package Database
      run: sudo apt-get update

    - name: Install Dependencies
      run: sudo apt-get install libgtkmm-3.0-dev gettext

    - name: Create Build Directory
      run: cmake -E make_directory build

    - name: Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}/build
      env:
        CC: gcc-${{ matrix.gcc }}
        CXX: g++-${{ matrix.gcc }}
      run: >
        cmake $GITHUB_WORKSPACE
        -DCMAKE_BUILD_TYPE=$BUILD_TYPE
        -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/toolchains/linux-dev.cmake"

    - name: Build
      shell: bash
      working-directory: ${{github.workspace}}/build
      run: cmake --build . --config $BUILD_TYPE

    - name: Test
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: ctest -C $BUILD_TYPE --rerun-failed --output-on-failure

    - name: Pack (cmake install and make binary package)
      shell: bash
      working-directory: ${{github.workspace}}/build
      run: cpack -G TBZ2

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: Linux Packages (Ubuntu ${{ matrix.os }})
        path: ${{github.workspace}}/build/gsmartcontrol-*-Linux*.*


  windows-msys2:
    uses: ./.github/workflows/windows-msys2.yml
    with:
      build-type: RelWithDebInfo
