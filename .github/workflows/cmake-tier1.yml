name: Build (Tier 1 platforms)

on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:


env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: RelWithDebInfo


jobs:

  linux-ubuntu-24_04:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Update Package Database
      run: sudo apt-get update

    - name: Install Dependencies
      run: sudo apt-get install libgtkmm-3.0-dev gettext

    - name: Create Build Directory
      run: cmake -E make_directory build

    - name: Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}/build
      env:
        CC: gcc-14
        CXX: g++-14
      run: >
        cmake $GITHUB_WORKSPACE
        -DCMAKE_BUILD_TYPE=$BUILD_TYPE
        -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/toolchains/linux-dev.cmake"

    - name: Build
      shell: bash
      working-directory: ${{github.workspace}}/build
      run: cmake --build . --config $BUILD_TYPE

    - name: Test
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: ctest -C $BUILD_TYPE --rerun-failed --output-on-failure

    - name: Pack (cmake install and make binary package)
      shell: bash
      working-directory: ${{github.workspace}}/build
      run: cpack -G TBZ2

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: Linux Packages
        path: ${{github.workspace}}/build/gsmartcontrol-*-Linux*.*


  linux-ubuntu-22_04:
    # GCC 11
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v7

    - name: Update Package Database
      run: sudo apt-get update

    - name: Install Dependencies
      run: sudo apt-get install libgtkmm-3.0-dev gettext

    - name: Create Build Directory
      run: cmake -E make_directory build

    - name: Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}/build
      env:
        CC: gcc-11
        CXX: g++-11
      run: >
        cmake $GITHUB_WORKSPACE
        -DCMAKE_BUILD_TYPE=$BUILD_TYPE
        -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/toolchains/linux-dev.cmake"

    - name: Build
      shell: bash
      working-directory: ${{github.workspace}}/build
      run: cmake --build . --config $BUILD_TYPE

    - name: Test
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: ctest -C $BUILD_TYPE --rerun-failed --output-on-failure

    - name: Pack (cmake install and make binary package)
      shell: bash
      working-directory: ${{github.workspace}}/build
      run: cpack -G TBZ2

#    - name: Upload artifacts
#      uses: actions/upload-artifact@v7
#      with:
#        name: Linux Packages
#        path: ${{github.workspace}}/build/gsmartcontrol-*-Linux*.*


  windows-msys2:
    uses: ./.github/workflows/windows-msys2.yml
    with:
      build-type: RelWithDebInfo
