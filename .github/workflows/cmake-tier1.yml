name: Build (Tier 1 platforms)

# Called from ci.yml (on push / pull request), or run manually from the Actions tab.
on:
  workflow_call:
  workflow_dispatch:


permissions:
  contents: read


env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: RelWithDebInfo


jobs:

  linux-ubuntu:
    name: linux-ubuntu-${{ matrix.os }} (gcc-${{ matrix.gcc }})
    runs-on: ubuntu-${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: [
          { os: "22.04", gcc: 11 },
          { os: "24.04", gcc: 14 },
          { os: "26.04", gcc: 15 },
        ]

    steps:
    - uses: actions/checkout@v7

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install libgtkmm-3.0-dev gettext

    - name: Configure CMake
      env:
        CC: gcc-${{ matrix.gcc }}
        CXX: g++-${{ matrix.gcc }}
      run: >
        cmake -B build -S "$GITHUB_WORKSPACE"
        -DCMAKE_BUILD_TYPE=$BUILD_TYPE
        -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/toolchains/linux-dev.cmake"

    - name: Build
      run: |
        set -o pipefail
        cmake --build build --config $BUILD_TYPE 2>&1 | tee build.log

    - name: Save build log
      if: ${{ always() }}
      uses: ./.github/actions/save-build-log
      with:
        id: linux-ubuntu-${{ matrix.os }}-gcc-${{ matrix.gcc }}
        title: Ubuntu ${{ matrix.os }} (GCC ${{ matrix.gcc }})

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C $BUILD_TYPE --rerun-failed --output-on-failure

    - name: Pack (cmake install and make binary package)
      working-directory: ${{github.workspace}}/build
      run: cpack -G TBZ2

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: Linux Packages (Ubuntu ${{ matrix.os }})
        path: ${{github.workspace}}/build/gsmartcontrol-*-Linux*.*


  windows-msys2:
    uses: ./.github/workflows/windows-msys2.yml
    with:
      build-type: RelWithDebInfo
