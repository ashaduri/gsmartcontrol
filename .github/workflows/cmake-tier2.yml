name: Build (Tier 2 platforms)

on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:


permissions:
  contents: read

# Cancel superseded runs of the same PR (pushes to main always run to completion).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: RelWithDebInfo


jobs:

  macos-homebrew:
    name: macos-homebrew (${{ matrix.compiler }})
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        compiler: [ apple-clang, llvm ]

    env:
      LLVM_VERSION: 20

    steps:
    - uses: actions/checkout@v7

    - name: Install Dependencies
      run: brew install pkg-config gtkmm3 cmake

    - name: Install LLVM
      if: ${{ matrix.compiler == 'llvm' }}
      run: |
        brew install llvm@$LLVM_VERSION
        echo "CXX=$(brew --prefix llvm@$LLVM_VERSION)/bin/clang++" >> "$GITHUB_ENV"

    - name: Configure CMake
      run: >
        cmake -B build -S "$GITHUB_WORKSPACE"
        -DCMAKE_BUILD_TYPE=$BUILD_TYPE
        -DAPP_BUILD_EXAMPLES=ON
        -DAPP_BUILD_TESTS=ON
        -DAPP_COMPILER_ENABLE_WARNINGS=ON

    - name: Build
      working-directory: ${{github.workspace}}/build
      run: cmake --build . --config $BUILD_TYPE

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C $BUILD_TYPE --rerun-failed --output-on-failure


  linux-ubuntu-clang:
    name: linux-ubuntu-${{ matrix.os }} (clang-${{ matrix.clang }})
    runs-on: ubuntu-${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: [
          { os: "24.04", clang: 18 },
          { os: "26.04", clang: 22 },
        ]

    steps:
    - uses: actions/checkout@v7

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install libgtkmm-3.0-dev gettext

    - name: Configure CMake
      env:
        CC: clang-${{ matrix.clang }}
        CXX: clang++-${{ matrix.clang }}
      run: >
        cmake -B build -S "$GITHUB_WORKSPACE"
        -DCMAKE_BUILD_TYPE=$BUILD_TYPE
        -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/toolchains/linux-dev.cmake"

    - name: Build
      working-directory: ${{github.workspace}}/build
      run: cmake --build . --config $BUILD_TYPE

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C $BUILD_TYPE --rerun-failed --output-on-failure
