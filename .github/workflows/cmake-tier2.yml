name: Build (Tier 2 platforms)

# Called from ci.yml (on push / pull request), or run manually from the Actions tab.
on:
  workflow_call:
  workflow_dispatch:


permissions:
  contents: read


env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: RelWithDebInfo


jobs:

  macos-homebrew:
    name: macos-homebrew (${{ matrix.compiler }})
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: [
          { compiler: apple-clang, title: "macOS (Apple Clang)" },
          { compiler: llvm, title: "macOS (Homebrew LLVM 20)" },
        ]

    env:
      LLVM_VERSION: 20

    steps:
    - uses: actions/checkout@v7

    - name: Install Dependencies
      run: brew install pkg-config gtkmm3 cmake

    - name: Install LLVM
      if: ${{ matrix.compiler == 'llvm' }}
      run: |
        brew install llvm@$LLVM_VERSION
        echo "CXX=$(brew --prefix llvm@$LLVM_VERSION)/bin/clang++" >> "$GITHUB_ENV"

    - name: Configure CMake
      run: >
        cmake -B build -S "$GITHUB_WORKSPACE"
        -DCMAKE_BUILD_TYPE=$BUILD_TYPE
        -DAPP_BUILD_EXAMPLES=ON
        -DAPP_BUILD_TESTS=ON
        -DAPP_COMPILER_ENABLE_WARNINGS=ON

    - name: Build
      run: |
        set -o pipefail
        cmake --build build --config $BUILD_TYPE 2>&1 | tee build.log

    - name: Save build log
      if: ${{ always() }}
      uses: ./.github/actions/save-build-log
      with:
        id: macos-${{ matrix.compiler }}
        title: ${{ matrix.title }}

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C $BUILD_TYPE --rerun-failed --output-on-failure


  linux-ubuntu-clang:
    name: linux-ubuntu-${{ matrix.os }} (clang-${{ matrix.clang }})
    runs-on: ubuntu-${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: [
          { os: "24.04", clang: 18 },
          { os: "26.04", clang: 22 },
        ]

    steps:
    - uses: actions/checkout@v7

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install libgtkmm-3.0-dev gettext

    - name: Configure CMake
      env:
        CC: clang-${{ matrix.clang }}
        CXX: clang++-${{ matrix.clang }}
      run: >
        cmake -B build -S "$GITHUB_WORKSPACE"
        -DCMAKE_BUILD_TYPE=$BUILD_TYPE
        -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/toolchains/linux-dev.cmake"

    - name: Build
      run: |
        set -o pipefail
        cmake --build build --config $BUILD_TYPE 2>&1 | tee build.log

    - name: Save build log
      if: ${{ always() }}
      uses: ./.github/actions/save-build-log
      with:
        id: linux-ubuntu-${{ matrix.os }}-clang-${{ matrix.clang }}
        title: Ubuntu ${{ matrix.os }} (Clang ${{ matrix.clang }})

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C $BUILD_TYPE --rerun-failed --output-on-failure
