name: Windows Release

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:


env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  SMARTMONTOOLS_INSTALLER: smartmontools-7.4-1.win32-setup.exe
  SMARTMONTOOLS_URL: https://downloads.sourceforge.net/project/smartmontools/smartmontools/7.4/smartmontools-7.4-1.win32-setup.exe


jobs:

  windows-msys2:
    runs-on: windows-latest
    strategy:
      matrix:
        include: [
          # MSYS2 has deprecated the MINGW64 (msvcrt) and MINGW32 environments and removed
          # most of their packages (including gtkmm3). UCRT64 is the recommended replacement.
          { msystem: UCRT64, arch: x86_64, platform: win64, pkgprefix: mingw-w64-ucrt-x86_64 },
          # { msystem: MINGW64, arch: x86_64, platform: win64, pkgprefix: mingw-w64-x86_64 },
          # { msystem: MINGW32, arch: i686, platform: win32, pkgprefix: mingw-w64-i686 }
        ]

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        # p7zip is needed to extract smartmontools
        # fontconfig owns /etc/fonts
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            ${{ matrix.pkgprefix }}-gtkmm3
            ${{ matrix.pkgprefix }}-pkg-config
            ${{ matrix.pkgprefix }}-cmake
            ${{ matrix.pkgprefix }}-gcc
            ${{ matrix.pkgprefix }}-fontconfig
            make
            p7zip

      # Note: The librsvg 2.58 downgrade step (for Windows 7 support) was removed,
      # since the MSYS2 repository no longer provides librsvg 2.58 packages.

      - name: Download Package Requirements
        shell: msys2 {0}
        working-directory: ${{github.workspace}}
        run: |
          mkdir -p build/smartmontools
          cd build/smartmontools
          wget $SMARTMONTOOLS_URL

      - name: Extract Package Requirements (64-bit)
        if: ${{ matrix.arch == 'x86_64' }}
        shell: msys2 {0}
        working-directory: ${{github.workspace}}/build/smartmontools
        run: >
          7z -bb1 e $SMARTMONTOOLS_INSTALLER
          bin/smartctl.exe
          bin/smartctl-nc.exe
          bin/update-smart-drivedb.ps1
          bin/drivedb.h

      - name: Extract Package Requirements (32-bit)
        if: ${{ matrix.arch == 'i686' }}
        shell: msys2 {0}
        working-directory: ${{github.workspace}}/build/smartmontools
        run: >
          7z -bb1 e $SMARTMONTOOLS_INSTALLER
          bin32/smartctl.exe
          bin32/smartctl-nc.exe
          bin/update-smart-drivedb.ps1
          bin/drivedb.h

      - name: List installed files
        shell: msys2 {0}
        run: |
          ls -1R "$MINGW_PREFIX"

      - name: Configure CMake
        shell: msys2 {0}
        run: >
          cmake -B build -S "$GITHUB_WORKSPACE"
          -G "MSYS Makefiles"
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE
          -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/toolchains/${{ matrix.platform }}-mingw-msys2.cmake"

      - name: Build
        shell: msys2 {0}
        working-directory: ${{github.workspace}}/build
        run: cmake --build . --config $BUILD_TYPE

      - name: Test
        working-directory: ${{github.workspace}}/build
        shell: msys2 {0}
        run: ctest -C $BUILD_TYPE --rerun-failed --output-on-failure

      - name: Package ZIP
        shell: msys2 {0}
        working-directory: ${{github.workspace}}/build
        run: cpack -G ZIP

      - name: Package NSIS (64-bit)
        if: ${{ matrix.arch == 'x86_64' }}
        shell: msys2 {0}
        working-directory: ${{github.workspace}}/build
        run: cpack -G NSIS64

      - name: Package NSIS (32-bit)
        if: ${{ matrix.arch == 'i686' }}
        shell: msys2 {0}
        working-directory: ${{github.workspace}}/build
        run: cpack -G NSIS

      - name: Upload artifacts
        if: ${{ matrix.arch == 'x86_64' }}
        uses: actions/upload-artifact@v4
        with:
          name: Windows 64-Bit Packages
          path: ${{github.workspace}}/build/gsmartcontrol-*-win*.*

      - name: Upload artifacts
        if: ${{ matrix.arch == 'i686' }}
        uses: actions/upload-artifact@v4
        with:
          name: Windows 32-Bit Packages
          path: ${{github.workspace}}/build/gsmartcontrol-*-win*.*

