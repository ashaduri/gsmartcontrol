name: Build (Tier 2 platforms with flaky builds)

# FreeBSD build via vmactions/freebsd-vm is known to fail randomly,
# so we don't want it to be triggered on every commit.

# Manually triggered
on: [workflow_dispatch]

permissions:
  contents: read

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: RelWithDebInfo
  # FreeBSD's LLVM ports install versioned binaries, e.g. clang++23.
  LLVM_VERSION: 23

jobs:

  freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v7

    - name: Build and test in FreeBSD
      uses: vmactions/freebsd-vm@v1
      with:
        release: "15.1"
        envs: 'BUILD_TYPE'
        usesh: true
        sync: rsync
        prepare: >
          pkg install -y cmake pkgconf gtkmm30 gettext libiconv llvm${{ env.LLVM_VERSION }}

        run: >
          mkdir build && cd build

          cmake ..
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE
          -DCMAKE_CXX_COMPILER=clang++${{ env.LLVM_VERSION }}
          -DAPP_BUILD_EXAMPLES=ON
          -DAPP_BUILD_TESTS=ON
          -DAPP_COMPILER_ENABLE_WARNINGS=ON

          cmake --build . --config $BUILD_TYPE

          ctest -C $BUILD_TYPE --rerun-failed --output-on-failure
